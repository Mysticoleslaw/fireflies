# GlowBug — servo arm hops 180° at random intervals; LED flashes and fades on each hop.
# One file for every bug: each device gets a unique name from its MAC (glowbug-a1b2c3).
#
# Wiring (D1 mini):
#   D1 (GPIO5) -> servo signal
#   D4 (GPIO2) -> 330 Ω -> WS2812B DIN
#   5V -> servo + LED, GND common, 470 µF across 5V/GND

substitutions:
  name: glowbug
  friendly_name: Glow Bug

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  on_boot:
    priority: -100
    then:
      - script.execute: schedule_next

esp8266:
  board: d1_mini
  restore_from_flash: true # keep settings across power cycles

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: # fallback hotspot if Wi-Fi is unreachable
    password: !secret fallback_password

captive_portal:

web_server: # REST + event stream at http://glowbug-xxxxxx.local/
  port: 80
  version: 3

globals:
  - id: next_hop
    type: uint32_t
    initial_value: "0"
  - id: at_b
    type: bool
    initial_value: "false"

# ---------- hardware ----------

output:
  - platform: esp8266_pwm
    id: servo_pwm
    pin: GPIO5
    frequency: 50 Hz # 20 ms period, so level = pulse_us / 20000

light:
  - platform: neopixelbus
    id: bug_led
    name: LED
    type: GRB
    variant: WS2812
    pin: GPIO2 # uses UART1 on ESP8266, no Wi-Fi interference
    num_leds: 1
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF

# ---------- controls (show up in HA + web UI) ----------

switch:
  - platform: template
    id: hopping
    name: Hopping
    icon: mdi:rabbit
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: schedule_next
    on_turn_off:
      - light.turn_off: bug_led

  - platform: template
    id: random_colour
    name: Random colour
    icon: mdi:palette
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: stay_lit
    name: Stay lit
    icon: mdi:lightbulb-on
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

button:
  - platform: template
    name: Hop now
    icon: mdi:debug-step-over
    on_press:
      - script.execute: hop

number:
  - platform: template
    id: min_wait
    name: Min wait
    entity_category: config
    unit_of_measurement: s
    min_value: 1
    max_value: 600
    step: 1
    initial_value: 10
    optimistic: true
    restore_value: true

  - platform: template
    id: max_wait
    name: Max wait
    entity_category: config
    unit_of_measurement: s
    min_value: 1
    max_value: 600
    step: 1
    initial_value: 30
    optimistic: true
    restore_value: true

  - platform: template
    id: flash_brightness
    name: Flash brightness
    entity_category: config
    unit_of_measurement: "%"
    min_value: 5
    max_value: 100
    step: 5
    initial_value: 100
    optimistic: true
    restore_value: true

  - platform: template
    id: swing_ms
    name: Swing time
    entity_category: config
    unit_of_measurement: ms
    min_value: 100
    max_value: 2000
    step: 50
    initial_value: 500
    optimistic: true
    restore_value: true

  - platform: template
    id: fade_ms
    name: Fade time
    entity_category: config
    unit_of_measurement: ms
    min_value: 0
    max_value: 5000
    step: 100
    initial_value: 1200
    optimistic: true
    restore_value: true

  - platform: template
    id: pulse_a
    name: Servo pulse A
    entity_category: config
    unit_of_measurement: µs
    min_value: 400
    max_value: 1500
    step: 10
    initial_value: 500
    optimistic: true
    restore_value: true

  - platform: template
    id: pulse_b
    name: Servo pulse B
    entity_category: config
    unit_of_measurement: µs
    min_value: 1500
    max_value: 2600
    step: 10
    initial_value: 2500
    optimistic: true
    restore_value: true

# ---------- behaviour ----------

script:
  - id: schedule_next
    then:
      - lambda: |-
          uint32_t lo = std::min(id(min_wait).state, id(max_wait).state);
          uint32_t hi = std::max(id(min_wait).state, id(max_wait).state);
          id(next_hop) = millis() + 1000UL * (lo + random_uint32() % (hi - lo + 1));

  - id: hop
    mode: restart
    then:
      - script.execute: schedule_next
      - lambda: |-
          id(at_b) = !id(at_b);
          float us = id(at_b) ? id(pulse_b).state : id(pulse_a).state;
          id(servo_pwm).set_level(us / 20000.0f);

          auto call = id(bug_led).turn_on();
          call.set_brightness(id(flash_brightness).state / 100.0f);
          call.set_transition_length(0);
          if (id(random_colour).state) {
            float r, g, b;
            hsv_to_rgb(random_uint32() % 360, 1.0f, 1.0f, r, g, b);
            call.set_rgb(r, g, b);
          } // else: keeps whatever colour the LED was last set to
          call.perform();
      - delay: !lambda return id(swing_ms).state;
      - output.turn_off: servo_pwm # go limp: quiet, no buzzing, saves power
      - if:
          condition:
            switch.is_off: stay_lit
          then:
            - lambda: |-
                auto call = id(bug_led).turn_off();
                call.set_transition_length(id(fade_ms).state);
                call.perform();

interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: return (int32_t)(millis() - id(next_hop)) >= 0;
          then:
            - if:
                condition:
                  switch.is_on: hopping
                then:
                  - script.execute: hop
                else:
                  - script.execute: schedule_next # no burst-hop when re-enabled
