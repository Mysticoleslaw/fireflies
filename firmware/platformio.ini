[platformio]
default_envs = d1_mini

[env:d1_mini]
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld  ; 1 MB for the web app, room left for OTA
monitor_speed = 115200
upload_speed = 460800
build_flags = -std=gnu++17
build_unflags = -std=gnu++11
extra_scripts = pre:scripts/embed_webapp.py
lib_deps =
  esp32async/ESPAsyncTCP@2.0.0
  esp32async/ESPAsyncWebServer@3.12.1
  bblanchon/ArduinoJson@7.4.3
  adafruit/Adafruit NeoPixel@1.15.5

; Over-the-air update of the current master: pio run -e ota -t upload
[env:ota]
extends = env:d1_mini
upload_protocol = espota
upload_port = fireflies.local
upload_flags = --auth=${sysenv.FF_OTA_PASSWORD}

; Test build that ignores home Wi-Fi, to try hotspot mode at home.
; Flash every bug with it (they must share a channel); go back with the normal upload.
[env:hotspot_test]
extends = env:d1_mini
build_flags = ${env:d1_mini.build_flags} -DFF_NO_HOME_WIFI

; Unit tests for lib/core on this computer: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
lib_compat_mode = off
